name: Metrics

on:
  # Schedule updates (daily at midnight)
  schedule:
    - cron: "0 0 * * *"
  # Allows running workflow manually from the Actions tab
  workflow_dispatch:
  push:
    branches: ["master", "main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Profile Metrics
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # 🎨 General Layout & Theme
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata

          # 👨‍💻 Lines of Code Changed
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: base

          # 🤹 Programming Languages (Deep Analysis)
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          # 📅 3D Isometric Commit Calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # 📜 Recent Activity Feed
          plugin_activity: yes
          plugin_activity_days: 14
          plugin_activity_filter: all
          plugin_activity_limit: 5
          plugin_activity_load: 300
          plugin_activity_visibility: all

          # 💬 GitHub Discussions
          plugin_discussions: yes
          plugin_discussions_categories: yes

          # 🏷️ Top Repository Topics
          plugin_topics: yes
          plugin_topics_limit: 15
          plugin_topics_mode: starred
          plugin_topics_sort: stars

          # 🤝 Repo Follow-up Status
          plugin_followup: yes
          plugin_followup_archived: yes
          plugin_followup_sections: repositories

          # ⭐ Starred Repositories Overview
          plugin_stars: yes
          plugin_stars_limit: 4

          # 🏛️ Notable Contributions
          plugin_notable: yes
          plugin_notable_from: organization
          plugin_notable_types: commit
